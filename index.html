<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saratov VPN - подключение в Happ</title>
<style>
:root{--o:#FF8200}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0a0a0a;color:#eee;font-family:ui-monospace,Menlo,Consolas,monospace;padding:24px}
.card{max-width:420px;width:100%;text-align:center}
h1{color:var(--o);font-size:22px;letter-spacing:2px;margin:0 0 14px}
p{color:#aaa;font-size:14px;line-height:1.5;margin:8px 0}
a.btn{display:none;margin:18px 0 10px;padding:16px;background:var(--o);color:#000;
text-decoration:none;font-weight:700;border-radius:12px;font-size:17px}
.hint{font-size:12px;color:#777}
#raw{display:none;word-break:break-all;font-size:11px;color:#888;background:#141414;padding:10px;border-radius:8px;margin-top:12px}
</style></head>
<body><div class="card">
<h1>SARATOV VPN</h1>
<p id="status">Готовлю подключение...</p>
<a id="open" class="btn">Открыть в Happ</a>
<p class="hint">Если приложение не открылось - установи Happ и нажми кнопку выше.</p>
<div id="raw"></div>
</div>
<script>
(function(){
 var p=new URLSearchParams(location.search);
 var to=p.get('to'), sub=p.get('sub');
 var st=document.getElementById('status'),btn=document.getElementById('open'),raw=document.getElementById('raw');
 function ready(link){
   if(!link||link.indexOf('happ://')!==0){fail();return;}
   btn.href=link;btn.style.display='block';
   st.textContent='Нажми кнопку, чтобы открыть Happ:';
   // авто-попытка (на части браузеров сработает без тапа)
   setTimeout(function(){try{location.href=link;}catch(e){}},200);
 }
 function fail(){
   st.textContent='Не удалось открыть автоматически. Скопируй ссылку и добавь её в Happ вручную ('+'+'+' -> Добавить из буфера):';
   if(sub){raw.style.display='block';raw.textContent=sub;}
 }
 if(to){ ready(to); return; }
 if(!sub){ st.textContent='Нет ссылки подписки.'; return; }
 // фоллбэк: шифруем из браузера (может не сработать из РФ без VPN)
 fetch('https://crypto.happ.su/api-v2.php',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({url:sub})})
  .then(function(r){return r.json()})
  .then(function(d){ready(d&&d.encrypted_link);})
  .catch(fail);
})();
</script>
</body></html>
